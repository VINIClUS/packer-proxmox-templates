# Prometheus baseline configuration for the centralized monitoring core.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: monitoring-core
    static_configs:
      - targets:
          - localhost:9090
        labels:
          host: monitoring-core
          ctid: "190"

  - job_name: monitoring-core-alloy
    static_configs:
      - targets:
          - localhost:12345
        labels:
          host: monitoring-core
          ctid: "190"

  - job_name: esus-pec-lxc-5437
    static_configs:
      - targets:
          - ESUS_PEC_LXC_TARGET_METRICS_HOST:9100
          - ESUS_PEC_LXC_TARGET_METRICS_HOST:9187
          - ESUS_PEC_LXC_TARGET_METRICS_HOST:9404
        labels:
          host: esus-pec-lxc-5437
          ctid: "133"
          app: esus-pec

  - job_name: nginx
    static_configs:
      - targets:
          - NGINX_CT_TARGET_METRICS_HOST:9100
          - NGINX_CT_TARGET_METRICS_HOST:9113
        labels:
          host: nginx
          ctid: "110"
          app: nginx

  - job_name: infisical
    static_configs:
      - targets:
          - INFISICAL_CT_TARGET_METRICS_HOST:9100
          - INFISICAL_CT_TARGET_METRICS_HOST:9187
          - INFISICAL_CT_TARGET_METRICS_HOST:9121
        labels:
          host: infisical
          ctid: "120"
          app: infisical

  - job_name: esus-pec-minio
    static_configs:
      - targets:
          - MINIO_CT_TARGET_METRICS_HOST:9100
        labels:
          host: esus-pec-minio
          ctid: "134"
          app: minio

  - job_name: esus-pec-minio-native
    scheme: https
    metrics_path: /minio/v2/metrics/cluster
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - MINIO_CT_TARGET_METRICS_HOST:9000
        labels:
          host: esus-pec-minio
          ctid: "134"
          app: minio

  - job_name: platform-http-probes
    metrics_path: /probe
    params:
      module: [http_2xx_insecure_tls]
    static_configs:
      - targets:
          - http://NGINX_CT_TARGET_METRICS_HOST/
        labels:
          host: nginx
          ctid: "110"
          app: nginx
      - targets:
          - http://INFISICAL_CT_TARGET_METRICS_HOST:8080/health
        labels:
          host: infisical
          ctid: "120"
          app: infisical
      - targets:
          - https://MINIO_CT_TARGET_METRICS_HOST:9000/minio/health/live
        labels:
          host: esus-pec-minio
          ctid: "134"
          app: minio
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
